<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Mi Agente IA - Realtime</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #0e1117;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .contenedor {
            width: min(840px, 94vw);
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 22px;
            padding: 36px;
            box-shadow: 0 20px 70px rgba(0, 0, 0, 0.45);
        }

        h1 {
            margin-top: 0;
            margin-bottom: 8px;
            font-size: 32px;
        }

        .subtitulo {
            color: #9da7b3;
            margin-bottom: 12px;
        }

        .capacidades {
            color: #9da7b3;
            margin-bottom: 24px;
            font-size: 14px;
            line-height: 1.7;
        }

        .estado {
            padding: 16px;
            border-radius: 12px;
            background: #0d1117;
            border: 1px solid #30363d;
            margin-bottom: 24px;
        }

        .indicador {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #777;
            display: inline-block;
            margin-right: 8px;
        }

        .conectado {
            background: #2ecc71;
        }

        .escuchando {
            background: #f1c40f;
        }

        .procesando {
            background: #3498db;
        }

        .error {
            background: #e74c3c;
        }

        .botones {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        button {
            padding: 15px 20px;
            border: 0;
            border-radius: 12px;
            font-size: 16px;
            cursor: pointer;
        }

        #conectar {
            background: #2ecc71;
            color: #07150d;
            font-weight: bold;
        }

        #desconectar {
            background: #30363d;
            color: white;
        }

        button:disabled {
            opacity: 0.45;
            cursor: not-allowed;
        }

        .log {
            margin-top: 24px;
            background: #0d1117;
            border: 1px solid #30363d;
            border-radius: 12px;
            padding: 15px;
            height: 320px;
            overflow-y: auto;
            font-family: monospace;
            font-size: 13px;
            color: #aeb8c4;
        }
    </style>
</head>

<body>

<div class="contenedor">

    <h1>🎙️ Mi Agente IA</h1>

    <div class="subtitulo">
        Asistente personal en tiempo real
    </div>

    <div class="capacidades">
        🧠 Memoria persistente
        &nbsp;·&nbsp;
        📚 RAG documental
        &nbsp;·&nbsp;
        ☁️ Google Drive
        &nbsp;·&nbsp;
        🔎 Análisis automático Drive → RAG
        &nbsp;·&nbsp;
        🎙️ Voz Realtime
    </div>

    <div class="estado">

        <span
            id="indicador"
            class="indicador"
        ></span>

        <span id="estado">
            Desconectado
        </span>

    </div>

    <div class="botones">

        <button id="conectar">
            🎙️ Iniciar conversación
        </button>

        <button
            id="desconectar"
            disabled
        >
            ⏹ Finalizar
        </button>

    </div>

    <div
        id="log"
        class="log"
    >
        Sistema preparado.
    </div>

</div>


<script>

let pc = null;
let dc = null;
let localStream = null;
let audioRemoto = null;


const botonConectar =
    document.getElementById("conectar");

const botonDesconectar =
    document.getElementById("desconectar");

const estado =
    document.getElementById("estado");

const indicador =
    document.getElementById("indicador");

const log =
    document.getElementById("log");


// ============================================================
// UTILIDADES
// ============================================================

function escribirLog(mensaje) {

    const hora =
        new Date().toLocaleTimeString();

    log.innerHTML +=
        "<br>[" +
        hora +
        "] " +
        mensaje;

    log.scrollTop =
        log.scrollHeight;
}


function cambiarEstado(
    texto,
    tipo=""
) {

    estado.textContent =
        texto;

    indicador.className =
        "indicador";


    if (tipo === "conectado") {
        indicador.classList.add("conectado");
    }

    if (tipo === "escuchando") {
        indicador.classList.add("escuchando");
    }

    if (tipo === "procesando") {
        indicador.classList.add("procesando");
    }

    if (tipo === "error") {
        indicador.classList.add("error");
    }
}


// ============================================================
// TOOLS
// ============================================================

const TOOLS = [

    {
        type: "function",

        name: "buscar_memoria",

        description:
            "Busca información guardada anteriormente en la memoria persistente del usuario.",

        parameters: {

            type: "object",

            properties: {

                consulta: {
                    type: "string"
                },

                limite: {
                    type: "integer",
                    default: 10
                }
            },

            required: [
                "consulta"
            ]
        }
    },


    {
        type: "function",

        name: "recordar",

        description:
            "Guarda información importante en memoria persistente para futuras conversaciones.",

        parameters: {

            type: "object",

            properties: {

                categoria: {
                    type: "string"
                },

                clave: {
                    type: "string"
                },

                contenido: {
                    type: "string"
                },

                importancia: {
                    type: "integer",
                    minimum: 1,
                    maximum: 5,
                    default: 3
                }
            },

            required: [
                "categoria",
                "clave",
                "contenido"
            ]
        }
    },


    {
        type: "function",

        name: "ver_memorias",

        description:
            "Lista las memorias persistentes activas.",

        parameters: {

            type: "object",

            properties: {

                categoria: {
                    type: "string"
                },

                limite: {
                    type: "integer",
                    default: 20
                }
            }
        }
    },


    {
        type: "function",

        name: "buscar_documentos",

        description:
            "Busca información dentro de los documentos ya indexados mediante RAG.",

        parameters: {

            type: "object",

            properties: {

                consulta: {
                    type: "string"
                },

                limite: {
                    type: "integer",
                    minimum: 1,
                    maximum: 8,
                    default: 5
                }
            },

            required: [
                "consulta"
            ]
        }
    },


    {
        type: "function",

        name: "buscar_drive",

        description:
            "Busca archivos en Google Drive por nombre. Úsala solo para localizar archivos, no para analizar su contenido.",

        parameters: {

            type: "object",

            properties: {

                consulta: {
                    type: "string"
                },

                limite: {
                    type: "integer",
                    minimum: 1,
                    maximum: 50,
                    default: 10
                }
            },

            required: [
                "consulta"
            ]
        }
    },


    {
        type: "function",

        name: "listar_drive",

        description:
            "Lista archivos recientes de Google Drive.",

        parameters: {

            type: "object",

            properties: {

                limite: {
                    type: "integer",
                    minimum: 1,
                    maximum: 50,
                    default: 10
                }
            }
        }
    },


    {
        type: "function",

        name: "obtener_archivo_drive",

        description:
            "Obtiene metadatos de un archivo específico de Google Drive.",

        parameters: {

            type: "object",

            properties: {

                file_id: {
                    type: "string"
                }
            },

            required: [
                "file_id"
            ]
        }
    },


    {
        type: "function",

        name: "indexar_drive",

        description:
            "Indexa un archivo específico de Google Drive. Úsala únicamente cuando el usuario lo solicite expresamente.",

        parameters: {

            type: "object",

            properties: {

                file_id: {
                    type: "string"
                },

                usuario_autorizo_indexacion: {
                    type: "boolean"
                }
            },

            required: [
                "file_id",
                "usuario_autorizo_indexacion"
            ]
        }
    },


    {
        type: "function",

        name: "analizar_archivo_drive",

        description:
            "Busca un archivo en Google Drive, lo incorpora al RAG y analiza su contenido en una sola operación. Úsala solamente cuando el usuario pida explícitamente leer, analizar, revisar, indexar o consultar el contenido de un archivo de Drive.",

        parameters: {

            type: "object",

            properties: {

                consulta_archivo: {

                    type: "string",

                    description:
                        "Nombre o parte del nombre del archivo que debe buscarse."
                },

                pregunta: {

                    type: "string",

                    description:
                        "Pregunta concreta que debe responderse utilizando el contenido del archivo."
                },

                usuario_autorizo_indexacion: {

                    type: "boolean",

                    description:
                        "Debe ser true solo si el usuario pidió expresamente analizar, leer, revisar o indexar el archivo."
                },

                limite: {

                    type: "integer",
                    minimum: 1,
                    maximum: 8,
                    default: 5
                }
            },

            required: [
                "consulta_archivo",
                "pregunta",
                "usuario_autorizo_indexacion"
            ]
        }
    }

];


// ============================================================
// REGISTRAR TOOLS
// ============================================================

function registrarTools() {

    if (
        !dc ||
        dc.readyState !== "open"
    ) {

        escribirLog(
            "No se pueden registrar tools: canal no disponible."
        );

        return;
    }


    const sessionUpdate = {

        type: "session.update",

        session: {

            type: "realtime",

            tools: TOOLS,

            tool_choice: "auto",

            instructions:
                "Eres un asistente personal profesional que conversa por voz en español. " +

                "Habla de forma clara, natural, breve y profesional. " +

                "MEMORIA: Si el usuario pide recordar o guardar información para conversaciones futuras, usa recordar. " +

                "Si pregunta qué recuerdas sobre algo anterior, usa buscar_memoria. " +

                "RAG: Si pregunta por contenido de documentos ya indexados, usa buscar_documentos. " +

                "DRIVE: Si solo quiere localizar o buscar un archivo en Drive, usa buscar_drive. " +

                "Si pregunta por archivos recientes, usa listar_drive. " +

                "ANÁLISIS AUTOMÁTICO DRIVE: Si el usuario pide explícitamente buscar un archivo de Drive y además leerlo, analizarlo, revisarlo o responder una pregunta usando su contenido, usa analizar_archivo_drive. " +

                "En ese caso, establece usuario_autorizo_indexacion en true porque la petición explícita de analizar o leer el archivo autoriza su incorporación local al RAG. " +

                "Si solo pide localizar el archivo, no indexices nada. " +

                "Si analizar_archivo_drive devuelve estado seleccion_requerida, informa que existen varios archivos y pide al usuario que identifique cuál desea analizar. " +

                "No elijas arbitrariamente entre varios archivos similares. " +

                "Google Drive está en modo lectura: no puedes modificar ni borrar archivos. " +

                "No inventes resultados de memoria, RAG ni Drive. " +

                "Si una herramienta no encuentra información suficiente, dilo claramente. " +

                "Nunca almacenes contraseñas, claves API, tokens ni credenciales."
        }
    };


    dc.send(
        JSON.stringify(
            sessionUpdate
        )
    );


    escribirLog(
        "🛠 Tools enviadas a la sesión."
    );

    escribirLog(
        "🧠 Memoria activa."
    );

    escribirLog(
        "📚 RAG activo."
    );

    escribirLog(
        "☁️ Google Drive activo."
    );

    escribirLog(
        "🔎 Análisis automático Drive → RAG activo."
    );
}


// ============================================================
// EJECUTAR TOOL
// ============================================================

async function ejecutarTool(
    functionCall
) {

    const nombre =
        functionCall.name;


    escribirLog(
        "🛠 Tool solicitada: "
        + nombre
    );


    let argumentos = {};


    try {

        argumentos =
            JSON.parse(
                functionCall.arguments
                || "{}"
            );

    }

    catch(error) {

        escribirLog(
            "❌ Argumentos inválidos para "
            + nombre
        );

        return;
    }


    if (
        nombre ===
        "analizar_archivo_drive"
    ) {

        cambiarEstado(
            "Analizando archivo de Drive...",
            "procesando"
        );

        escribirLog(
            "🔎 Buscando archivo en Drive..."
        );

        escribirLog(
            "📥 Preparando incorporación al RAG..."
        );

    }

    else if (
        nombre === "buscar_drive"
        ||
        nombre === "listar_drive"
        ||
        nombre === "obtener_archivo_drive"
    ) {

        cambiarEstado(
            "Consultando Google Drive...",
            "procesando"
        );

        escribirLog(
            "☁️ Consultando Google Drive..."
        );

    }

    else if (
        nombre === "indexar_drive"
    ) {

        cambiarEstado(
            "Indexando archivo...",
            "procesando"
        );

        escribirLog(
            "📥 Indexando archivo de Drive..."
        );

    }

    else if (
        nombre === "buscar_documentos"
    ) {

        cambiarEstado(
            "Buscando en documentos...",
            "procesando"
        );

        escribirLog(
            "📚 Consultando RAG..."
        );

    }

    else if (
        nombre === "buscar_memoria"
        ||
        nombre === "ver_memorias"
    ) {

        cambiarEstado(
            "Consultando memoria...",
            "procesando"
        );

    }

    else {

        cambiarEstado(
            "Ejecutando herramienta...",
            "procesando"
        );
    }


    try {

        const respuesta =
            await fetch(
                "/tool",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({

                            name:
                                nombre,

                            arguments:
                                argumentos
                        })
                }
            );


        const resultado =
            await respuesta.json();


        if (!respuesta.ok) {

            throw new Error(
                JSON.stringify(
                    resultado
                )
            );
        }


        escribirLog(
            "✅ Tool completada: "
            + nombre
        );


        if (
            nombre ===
            "buscar_documentos"
        ) {

            const cantidad =
                resultado
                    ?.result
                    ?.length
                || 0;

            escribirLog(
                "📚 Fragmentos recuperados: "
                + cantidad
            );
        }


        if (
            nombre === "buscar_drive"
            ||
            nombre === "listar_drive"
        ) {

            const cantidad =
                resultado
                    ?.result
                    ?.length
                || 0;

            escribirLog(
                "☁️ Archivos encontrados: "
                + cantidad
            );
        }


        if (
            nombre ===
            "indexar_drive"
        ) {

            escribirLog(
                "📥 Fragmentos agregados: "
                +
                (
                    resultado
                        ?.fragmentos_agregados
                    ?? 0
                )
            );
        }


        if (
            nombre ===
            "analizar_archivo_drive"
        ) {

            if (
                resultado.estado ===
                "seleccion_requerida"
            ) {

                escribirLog(
                    "⚠️ Se encontraron varios archivos. Se requiere selección."
                );

            }

            else if (
                resultado.estado ===
                "sin_resultados"
            ) {

                escribirLog(
                    "⚠️ No se encontró el archivo solicitado."
                );

            }

            else if (
                resultado.estado ===
                "analizado"
            ) {

                escribirLog(
                    "✅ Archivo incorporado y analizado."
                );

                escribirLog(
                    "📚 Fragmentos recuperados: "
                    +
                    (
                        resultado
                            ?.result
                            ?.length
                        || 0
                    )
                );
            }
        }


        const eventoResultado = {

            type:
                "conversation.item.create",

            item: {

                type:
                    "function_call_output",

                call_id:
                    functionCall.call_id,

                output:
                    JSON.stringify(
                        resultado
                    )
            }
        };


        dc.send(
            JSON.stringify(
                eventoResultado
            )
        );


        dc.send(
            JSON.stringify({
                type:
                    "response.create"
            })
        );


        cambiarEstado(
            "Generando respuesta...",
            "procesando"
        );

    }

    catch(error) {

        escribirLog(
            "❌ ERROR tool: "
            + error.message
        );

        cambiarEstado(
            "Error en herramienta",
            "error"
        );
    }
}


// ============================================================
// EVENTOS REALTIME
// ============================================================

async function procesarEvento(
    eventoAPI
) {

    console.log(
        eventoAPI
    );


    if (
        eventoAPI.type ===
        "session.created"
    ) {

        escribirLog(
            "Sesión Realtime creada."
        );
    }


    if (
        eventoAPI.type ===
        "session.updated"
    ) {

        escribirLog(
            "✅ Sesión actualizada. Tools activas."
        );
    }


    if (
        eventoAPI.type ===
        "input_audio_buffer.speech_started"
    ) {

        cambiarEstado(
            "Escuchando...",
            "escuchando"
        );
    }


    if (
        eventoAPI.type ===
        "input_audio_buffer.speech_stopped"
    ) {

        cambiarEstado(
            "Procesando...",
            "procesando"
        );
    }


    if (
        eventoAPI.type ===
        "response.output_item.done"
    ) {

        const item =
            eventoAPI.item;


        if (
            item &&
            item.type ===
            "function_call"
        ) {

            await ejecutarTool(
                item
            );

            return;
        }
    }


    if (
        eventoAPI.type ===
        "response.done"
    ) {

        cambiarEstado(
            "Escuchando",
            "escuchando"
        );
    }


    if (
        eventoAPI.type ===
        "error"
    ) {

        escribirLog(
            "❌ ERROR API: "
            +
            JSON.stringify(
                eventoAPI.error
            )
        );

        cambiarEstado(
            "Error",
            "error"
        );
    }
}


// ============================================================
// CONECTAR
// ============================================================

async function conectar() {

    try {

        botonConectar.disabled =
            true;


        cambiarEstado(
            "Conectando..."
        );


        escribirLog(
            "Solicitando sesión..."
        );


        const tokenResponse =
            await fetch(
                "/token"
            );


        const tokenData =
            await tokenResponse.json();


        if (!tokenResponse.ok) {

            throw new Error(
                JSON.stringify(
                    tokenData
                )
            );
        }


        const ephemeralKey =
            tokenData.value;


        if (!ephemeralKey) {

            throw new Error(
                "No se recibió token efímero."
            );
        }


        escribirLog(
            "Token recibido."
        );


        pc =
            new RTCPeerConnection();


        audioRemoto =
            document.createElement(
                "audio"
            );


        audioRemoto.autoplay =
            true;


        pc.ontrack =
            function(evento) {

                audioRemoto.srcObject =
                    evento.streams[0];


                escribirLog(
                    "Audio del asistente activo."
                );
            };


        localStream =
            await navigator
                .mediaDevices
                .getUserMedia({
                    audio: true
                });


        const pistaAudio =
            localStream
                .getAudioTracks()[0];


        pc.addTrack(
            pistaAudio,
            localStream
        );


        escribirLog(
            "Micrófono conectado."
        );


        dc =
            pc.createDataChannel(
                "oai-events"
            );


        dc.onopen =
            function() {

                escribirLog(
                    "Canal de eventos activo."
                );


                registrarTools();


                cambiarEstado(
                    "Escuchando",
                    "escuchando"
                );
            };


        dc.onmessage =
            async function(evento) {

                try {

                    const eventoAPI =
                        JSON.parse(
                            evento.data
                        );


                    await procesarEvento(
                        eventoAPI
                    );

                }

                catch(error) {

                    console.error(
                        error
                    );


                    escribirLog(
                        "Error procesando evento: "
                        + error.message
                    );
                }
            };


        const oferta =
            await pc.createOffer();


        await pc.setLocalDescription(
            oferta
        );


        const respuestaSDP =
            await fetch(
                "https://api.openai.com/v1/realtime/calls",
                {
                    method:
                        "POST",

                    body:
                        oferta.sdp,

                    headers: {

                        "Authorization":
                            "Bearer "
                            + ephemeralKey,

                        "Content-Type":
                            "application/sdp"
                    }
                }
            );


        if (!respuestaSDP.ok) {

            const errorTexto =
                await respuestaSDP.text();


            throw new Error(
                errorTexto
            );
        }


        const answer = {

            type:
                "answer",

            sdp:
                await respuestaSDP.text()
        };


        await pc.setRemoteDescription(
            answer
        );


        botonDesconectar.disabled =
            false;


        escribirLog(
            "Conexión Realtime establecida."
        );

    }

    catch(error) {

        console.error(
            error
        );


        escribirLog(
            "❌ ERROR: "
            + error.message
        );


        cambiarEstado(
            "Error",
            "error"
        );


        botonConectar.disabled =
            false;
    }
}


// ============================================================
// DESCONECTAR
// ============================================================

function desconectar() {

    if (localStream) {

        localStream
            .getTracks()
            .forEach(
                function(track) {
                    track.stop();
                }
            );
    }


    if (dc) {
        dc.close();
    }


    if (pc) {
        pc.close();
    }


    pc = null;
    dc = null;
    localStream = null;


    cambiarEstado(
        "Desconectado"
    );


    botonConectar.disabled =
        false;


    botonDesconectar.disabled =
        true;


    escribirLog(
        "Sesión finalizada."
    );
}


// ============================================================
// BOTONES
// ============================================================

botonConectar.addEventListener(
    "click",
    conectar
);


botonDesconectar.addEventListener(
    "click",
    desconectar
);

</script>

</body>
</html>
