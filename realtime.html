<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Mi Agente IA - Realtime</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #0e1117;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .contenedor {
            width: min(760px, 92vw);
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 22px;
            padding: 36px;
            box-shadow: 0 20px 70px rgba(0, 0, 0, 0.45);
        }

        h1 {
            margin-top: 0;
            margin-bottom: 8px;
            font-size: 32px;
        }

        .subtitulo {
            color: #9da7b3;
            margin-bottom: 12px;
        }

        .capacidades {
            color: #9da7b3;
            margin-bottom: 24px;
            font-size: 14px;
        }

        .estado {
            padding: 16px;
            border-radius: 12px;
            background: #0d1117;
            border: 1px solid #30363d;
            margin-bottom: 24px;
        }

        .indicador {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #777;
            display: inline-block;
            margin-right: 8px;
        }

        .conectado {
            background: #2ecc71;
        }

        .escuchando {
            background: #f1c40f;
        }

        .procesando {
            background: #3498db;
        }

        .error {
            background: #e74c3c;
        }

        .botones {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        button {
            padding: 15px 20px;
            border: 0;
            border-radius: 12px;
            font-size: 16px;
            cursor: pointer;
        }

        #conectar {
            background: #2ecc71;
            color: #07150d;
            font-weight: bold;
        }

        #desconectar {
            background: #30363d;
            color: white;
        }

        button:disabled {
            opacity: 0.45;
            cursor: not-allowed;
        }

        .log {
            margin-top: 24px;
            background: #0d1117;
            border: 1px solid #30363d;
            border-radius: 12px;
            padding: 15px;
            height: 280px;
            overflow-y: auto;
            font-family: monospace;
            font-size: 13px;
            color: #aeb8c4;
        }
    </style>

</head>


<body>

<div class="contenedor">

    <h1>🎙️ Mi Agente IA</h1>

    <div class="subtitulo">
        Conversación de voz en tiempo real
    </div>

    <div class="capacidades">
        🧠 Memoria persistente
        &nbsp;·&nbsp;
        📚 RAG documental
        &nbsp;·&nbsp;
        🎙️ Voz Realtime
        &nbsp;·&nbsp;
        🛠 Tools
    </div>

    <div class="estado">

        <span
            id="indicador"
            class="indicador"
        ></span>

        <span id="estado">
            Desconectado
        </span>

    </div>

    <div class="botones">

        <button id="conectar">
            🎙️ Iniciar conversación
        </button>

        <button
            id="desconectar"
            disabled
        >
            ⏹ Finalizar
        </button>

    </div>

    <div
        id="log"
        class="log"
    >
        Sistema preparado.
    </div>

</div>


<script>

let pc = null;
let dc = null;
let localStream = null;
let audioRemoto = null;


const botonConectar =
    document.getElementById("conectar");

const botonDesconectar =
    document.getElementById("desconectar");

const estado =
    document.getElementById("estado");

const indicador =
    document.getElementById("indicador");

const log =
    document.getElementById("log");


// ============================================================
// UTILIDADES
// ============================================================

function escribirLog(mensaje) {

    const hora =
        new Date().toLocaleTimeString();

    log.innerHTML +=
        "<br>[" +
        hora +
        "] " +
        mensaje;

    log.scrollTop =
        log.scrollHeight;
}


function cambiarEstado(
    texto,
    tipo=""
) {

    estado.textContent =
        texto;

    indicador.className =
        "indicador";


    if (tipo === "conectado") {

        indicador
            .classList
            .add("conectado");
    }


    if (tipo === "escuchando") {

        indicador
            .classList
            .add("escuchando");
    }


    if (tipo === "procesando") {

        indicador
            .classList
            .add("procesando");
    }


    if (tipo === "error") {

        indicador
            .classList
            .add("error");
    }
}


// ============================================================
// TOOLS
// ============================================================

const TOOLS = [

    // --------------------------------------------------------
    // BUSCAR MEMORIA
    // --------------------------------------------------------

    {
        type: "function",

        name: "buscar_memoria",

        description:
            "Busca información guardada en la memoria persistente del usuario. Úsala cuando el usuario pregunte qué recuerdas sobre un proyecto, decisión, pendiente, preferencia u otra información previa.",

        parameters: {

            type: "object",

            properties: {

                consulta: {
                    type: "string",
                    description:
                        "Texto o concepto a buscar en la memoria."
                },

                limite: {
                    type: "integer",
                    default: 10
                }
            },

            required: [
                "consulta"
            ]
        }
    },


    // --------------------------------------------------------
    // RECORDAR
    // --------------------------------------------------------

    {
        type: "function",

        name: "recordar",

        description:
            "Guarda información importante en memoria persistente para utilizarla en conversaciones futuras.",

        parameters: {

            type: "object",

            properties: {

                categoria: {
                    type: "string",

                    description:
                        "Categoría, por ejemplo proyecto, pendiente, preferencia, persona o configuración."
                },

                clave: {
                    type: "string",

                    description:
                        "Nombre corto y reconocible de la memoria."
                },

                contenido: {
                    type: "string",

                    description:
                        "Información concreta que debe conservarse."
                },

                importancia: {
                    type: "integer",
                    minimum: 1,
                    maximum: 5,
                    default: 3
                }
            },

            required: [
                "categoria",
                "clave",
                "contenido"
            ]
        }
    },


    // --------------------------------------------------------
    // VER MEMORIAS
    // --------------------------------------------------------

    {
        type: "function",

        name: "ver_memorias",

        description:
            "Lista memorias persistentes activas. Úsala cuando el usuario pregunte qué recuerdas en general.",

        parameters: {

            type: "object",

            properties: {

                categoria: {
                    type: "string"
                },

                limite: {
                    type: "integer",
                    default: 20
                }
            }
        }
    },


    // --------------------------------------------------------
    // BUSCAR DOCUMENTOS - RAG
    // --------------------------------------------------------

    {
        type: "function",

        name: "buscar_documentos",

        description:
            "Busca información dentro de los documentos indexados del usuario mediante búsqueda semántica RAG. Debe utilizarse cuando el usuario pregunte qué dice un documento, informe, PDF, DOCX, TXT, archivo, antecedente documental o solicite buscar información dentro de sus documentos.",

        parameters: {

            type: "object",

            properties: {

                consulta: {

                    type: "string",

                    description:
                        "Pregunta o información que debe buscarse dentro de los documentos indexados."
                },

                limite: {

                    type: "integer",

                    description:
                        "Número máximo de fragmentos relevantes a recuperar.",

                    default: 5,

                    minimum: 1,

                    maximum: 8
                }
            },

            required: [
                "consulta"
            ]
        }
    }

];


// ============================================================
// REGISTRAR TOOLS
// ============================================================

function registrarTools() {

    if (
        !dc ||
        dc.readyState !== "open"
    ) {

        escribirLog(
            "No se pueden registrar tools: canal no disponible."
        );

        return;
    }


    const sessionUpdate = {

        type: "session.update",

        session: {

            type: "realtime",

            tools: TOOLS,

            tool_choice: "auto",

            instructions:
                "Eres un asistente personal profesional que conversa por voz en español. " +

                "Habla de manera natural, clara, concisa y profesional. " +

                "Tienes acceso a memoria persistente y a documentos indexados mediante RAG. " +

                "Si el usuario dice recuerda, guarda esto, ten presente o solicita conservar información para el futuro, debes usar recordar. " +

                "No digas que has guardado información si no ejecutaste recordar. " +

                "Si pregunta qué recuerdas sobre conversaciones anteriores, usa buscar_memoria. " +

                "Si pregunta qué recuerdas en general, puedes usar ver_memorias. " +

                "Si pregunta por el contenido de un documento, informe, archivo, PDF, DOCX o TXT, o solicita buscar información dentro de sus documentos, usa buscar_documentos. " +

                "Cuando uses buscar_documentos, basa tu respuesta en los fragmentos devueltos por la herramienta. " +

                "Si los documentos no contienen información suficiente para responder, dilo claramente. " +

                "No inventes datos documentales. " +

                "No confundas memoria con documentos. " +

                "La memoria se usa para información persistente guardada previamente. " +

                "El RAG se usa para consultar documentos indexados. " +

                "No guardes contraseñas, API keys, tokens ni credenciales. " +

                "Después de ejecutar una herramienta, responde naturalmente por voz."
        }
    };


    dc.send(
        JSON.stringify(
            sessionUpdate
        )
    );


    escribirLog(
        "🛠 Tools enviadas a la sesión."
    );

    escribirLog(
        "📚 RAG documental registrado."
    );
}


// ============================================================
// EJECUTAR TOOL
// ============================================================

async function ejecutarTool(
    functionCall
) {

    escribirLog(
        "🛠 Tool solicitada: "
        + functionCall.name
    );


    let argumentos = {};


    try {

        argumentos =
            JSON.parse(
                functionCall.arguments
                || "{}"
            );

    }

    catch(error) {

        escribirLog(
            "ERROR: argumentos inválidos para "
            + functionCall.name
        );

        return;
    }


    if (
        functionCall.name ===
        "buscar_documentos"
    ) {

        cambiarEstado(
            "Buscando en documentos...",
            "procesando"
        );

        escribirLog(
            "📚 Consultando índice RAG..."
        );

    }

    else if (
        functionCall.name ===
        "buscar_memoria"
        ||
        functionCall.name ===
        "ver_memorias"
    ) {

        cambiarEstado(
            "Consultando memoria...",
            "procesando"
        );

    }

    else {

        cambiarEstado(
            "Ejecutando herramienta...",
            "procesando"
        );
    }


    try {

        const respuesta =
            await fetch(
                "/tool",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({

                            name:
                                functionCall.name,

                            arguments:
                                argumentos
                        })
                }
            );


        const resultado =
            await respuesta.json();


        if (!respuesta.ok) {

            throw new Error(
                JSON.stringify(
                    resultado
                )
            );
        }


        escribirLog(
            "✅ Tool completada: "
            + functionCall.name
        );


        if (
            functionCall.name ===
            "buscar_documentos"
        ) {

            const cantidad =
                resultado
                    ?.result
                    ?.length
                || 0;


            escribirLog(
                "📚 Fragmentos recuperados: "
                + cantidad
            );
        }


        // ====================================================
        // DEVOLVER TOOL OUTPUT
        // ====================================================

        const eventoResultado = {

            type:
                "conversation.item.create",

            item: {

                type:
                    "function_call_output",

                call_id:
                    functionCall.call_id,

                output:
                    JSON.stringify(
                        resultado
                    )
            }
        };


        dc.send(
            JSON.stringify(
                eventoResultado
            )
        );


        // ====================================================
        // PEDIR RESPUESTA AL MODELO
        // ====================================================

        dc.send(
            JSON.stringify({

                type:
                    "response.create"
            })
        );


        cambiarEstado(
            "Generando respuesta...",
            "procesando"
        );

    }

    catch(error) {

        escribirLog(
            "ERROR tool: "
            + error.message
        );

        cambiarEstado(
            "Error en herramienta",
            "error"
        );
    }
}


// ============================================================
// EVENTOS REALTIME
// ============================================================

async function procesarEvento(
    eventoAPI
) {

    console.log(
        eventoAPI
    );


    if (
        eventoAPI.type ===
        "session.created"
    ) {

        escribirLog(
            "Sesión Realtime creada."
        );
    }


    if (
        eventoAPI.type ===
        "session.updated"
    ) {

        escribirLog(
            "✅ Sesión actualizada. Tools activas."
        );
    }


    if (
        eventoAPI.type ===
        "input_audio_buffer.speech_started"
    ) {

        cambiarEstado(
            "Escuchando...",
            "escuchando"
        );
    }


    if (
        eventoAPI.type ===
        "input_audio_buffer.speech_stopped"
    ) {

        cambiarEstado(
            "Procesando...",
            "procesando"
        );
    }


    // ========================================================
    // FUNCTION CALL
    // ========================================================

    if (
        eventoAPI.type ===
        "response.output_item.done"
    ) {

        const item =
            eventoAPI.item;


        if (
            item &&
            item.type ===
            "function_call"
        ) {

            await ejecutarTool(
                item
            );

            return;
        }
    }


    if (
        eventoAPI.type ===
        "response.done"
    ) {

        cambiarEstado(
            "Escuchando",
            "escuchando"
        );
    }


    if (
        eventoAPI.type ===
        "error"
    ) {

        escribirLog(
            "❌ ERROR API: "
            +
            JSON.stringify(
                eventoAPI.error
            )
        );

        cambiarEstado(
            "Error",
            "error"
        );
    }
}


// ============================================================
// CONECTAR
// ============================================================

async function conectar() {

    try {

        botonConectar.disabled =
            true;


        cambiarEstado(
            "Conectando..."
        );


        escribirLog(
            "Solicitando sesión..."
        );


        // ====================================================
        // TOKEN
        // ====================================================

        const tokenResponse =
            await fetch(
                "/token"
            );


        const tokenData =
            await tokenResponse.json();


        if (!tokenResponse.ok) {

            throw new Error(
                JSON.stringify(
                    tokenData
                )
            );
        }


        const ephemeralKey =
            tokenData.value;


        if (!ephemeralKey) {

            throw new Error(
                "No se recibió token efímero."
            );
        }


        escribirLog(
            "Token recibido."
        );


        // ====================================================
        // WEBRTC
        // ====================================================

        pc =
            new RTCPeerConnection();


        // ====================================================
        // AUDIO DEL ASISTENTE
        // ====================================================

        audioRemoto =
            document.createElement(
                "audio"
            );


        audioRemoto.autoplay =
            true;


        pc.ontrack =
            function(evento) {

                audioRemoto.srcObject =
                    evento.streams[0];


                escribirLog(
                    "Audio del asistente activo."
                );
            };


        // ====================================================
        // MICRÓFONO
        // ====================================================

        localStream =
            await navigator
                .mediaDevices
                .getUserMedia({
                    audio: true
                });


        const pistaAudio =
            localStream
                .getAudioTracks()[0];


        pc.addTrack(
            pistaAudio,
            localStream
        );


        escribirLog(
            "Micrófono conectado."
        );


        // ====================================================
        // DATA CHANNEL
        // ====================================================

        dc =
            pc.createDataChannel(
                "oai-events"
            );


        dc.onopen =
            function() {

                escribirLog(
                    "Canal de eventos activo."
                );


                registrarTools();


                cambiarEstado(
                    "Escuchando",
                    "escuchando"
                );
            };


        dc.onmessage =
            async function(evento) {

                try {

                    const eventoAPI =
                        JSON.parse(
                            evento.data
                        );


                    await procesarEvento(
                        eventoAPI
                    );

                }

                catch(error) {

                    console.error(
                        error
                    );


                    escribirLog(
                        "Error procesando evento: "
                        + error.message
                    );
                }
            };


        // ====================================================
        // SDP
        // ====================================================

        const oferta =
            await pc.createOffer();


        await pc.setLocalDescription(
            oferta
        );


        const respuestaSDP =
            await fetch(
                "https://api.openai.com/v1/realtime/calls",
                {
                    method:
                        "POST",

                    body:
                        oferta.sdp,

                    headers: {

                        "Authorization":
                            "Bearer "
                            + ephemeralKey,

                        "Content-Type":
                            "application/sdp"
                    }
                }
            );


        if (!respuestaSDP.ok) {

            const errorTexto =
                await respuestaSDP.text();


            throw new Error(
                errorTexto
            );
        }


        const answer = {

            type:
                "answer",

            sdp:
                await respuestaSDP.text()
        };


        await pc.setRemoteDescription(
            answer
        );


        botonDesconectar.disabled =
            false;


        escribirLog(
            "Conexión Realtime establecida."
        );

    }

    catch(error) {

        console.error(
            error
        );


        escribirLog(
            "ERROR: "
            + error.message
        );


        cambiarEstado(
            "Error",
            "error"
        );


        botonConectar.disabled =
            false;
    }
}


// ============================================================
// DESCONECTAR
// ============================================================

function desconectar() {

    if (localStream) {

        localStream
            .getTracks()
            .forEach(
                function(track) {
                    track.stop();
                }
            );
    }


    if (dc) {
        dc.close();
    }


    if (pc) {
        pc.close();
    }


    pc = null;
    dc = null;
    localStream = null;


    cambiarEstado(
        "Desconectado"
    );


    botonConectar.disabled =
        false;


    botonDesconectar.disabled =
        true;


    escribirLog(
        "Sesión finalizada."
    );
}


// ============================================================
// BOTONES
// ============================================================

botonConectar.addEventListener(
    "click",
    conectar
);


botonDesconectar.addEventListener(
    "click",
    desconectar
);

</script>

</body>

</html>
